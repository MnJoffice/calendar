<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="제주의 행사와 개화 시기, 날짜별 할 일을 함께 관리하는 2026년 달력">
  <title>제주 2026 캘린더</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c51f35'/%3E%3Cpath d='M17 22h30v26H17z' fill='white'/%3E%3Cpath d='M17 22h30v8H17z' fill='%23f4bdc5'/%3E%3Cpath d='M24 16v11M40 16v11' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
        <div><strong>제주 2026</strong><small>나의 섬 생활 달력</small></div>
      </div>
      <div class="header-actions">
        <span class="season-emoji" id="seasonEmoji" aria-hidden="true">🌸</span>
        <button class="today-btn" id="todayBtn">오늘</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="month-rail" aria-label="월 선택">
        <div class="rail-heading"><span>2026</span><small>병오년</small></div>
        <nav id="monthNav"></nav>
        <div class="rail-note">제주의 계절과<br>나의 하루를 한곳에</div>
      </aside>

      <main class="calendar-area">
        <section class="month-header">
          <div>
            <p class="eyebrow" id="seasonLabel">SPRING IN JEJU</p>
            <h1><span id="monthNumber">3</span>월 <em id="monthEnglish">MARCH</em></h1>
          </div>
          <div class="month-controls">
            <button id="prevMonth" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
            <button id="nextMonth" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </section>

        <section class="season-card" id="seasonCard" aria-label="이달의 제주 계절 정보">
          <div class="season-index">03</div>
          <div><span>이달의 제주</span><strong id="seasonTitle">봄빛이 가장 먼저 닿는 섬</strong></div>
          <p id="seasonDescription">유채꽃과 왕벚꽃이 이어 피는 시기예요.</p>
        </section>

        <section class="calendar-card">
          <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="2026년 월간 달력"></div>
        </section>

        <section class="bloom-strip">
          <div class="section-title"><span>JEJU BLOOM</span><h2>이달의 개화 소식</h2></div>
          <div class="bloom-list" id="bloomList"></div>
          <p class="bloom-notice">개화 시기는 날씨와 지역에 따라 달라질 수 있습니다.</p>
        </section>
      </main>

      <aside class="day-panel" id="dayPanel">
        <div class="selected-date">
          <p id="selectedFullDate">2026년 3월 18일</p>
          <div><strong id="selectedDay">18</strong><span id="selectedWeekday">수요일</span></div>
        </div>

        <section class="panel-section event-section">
          <div class="panel-heading"><h2>제주 일정</h2><span id="eventCount">0개</span></div>
          <div id="eventList" class="event-list"></div>
        </section>

        <section class="panel-section todo-section">
          <div class="panel-heading"><h2>할 일</h2><span id="todoProgress">0 / 0</span></div>
          <form id="todoForm">
            <input id="todoInput" maxlength="60" autocomplete="off" placeholder="할 일을 입력하세요" aria-label="할 일 입력">
            <button aria-label="할 일 추가">추가</button>
          </form>
          <ul id="todoList" class="todo-list"></ul>
          <div class="empty-state" id="todoEmpty">아직 등록된 할 일이 없어요.</div>
        </section>

        <a class="source-link" href="https://www.visitjeju.net/kr/festival/list" target="_blank" rel="noopener">비짓제주 행사 일정 확인 <svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      </aside>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
